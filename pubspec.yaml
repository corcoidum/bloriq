name: bloriq
description: BLORIQ one-turn echo puzzle prototype.
publish_to: 'none'
version: 1.0.0+8

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: 1.38.2
  intl: ^0.20.3
  shared_preferences: ^2.5.3
  share_plus: ^12.0.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/levels/levels.json
    - assets/levels/daily_pool_v1.json
    - assets/levels/world2.json
    - assets/levels/world3.json
    - assets/levels/world4.json
    - assets/levels/world5.json
    - assets/levels/world6.json
    - assets/levels/world7.json
    - assets/levels/endless_pool_v1.json
    - assets/levels/endless_pool_v2.json
    - assets/levels/trials_v1.json
    - assets/audio/
    - assets/art/star_courier/
    - assets/art/last_echo/
    - assets/art/season1/
    - assets/art/moon_garden/
    - assets/art/world2/spirits/
    - assets/art/world2/board/
    - assets/art/world3/spirits/
    - assets/art/world3/board/
    - assets/art/world4/spirits/
    - assets/art/world4/board/
    - assets/art/world5/spirits/
    - assets/art/world5/board/
    - assets/art/world6/spirits/
    - assets/art/world6/board/
    - assets/art/world7/spirits/
    - assets/art/world7/board/
    - assets/story/season1.json
    - assets/story/world2.json
    - assets/story/world3.json
    - assets/story/world4.json
    - assets/story/world5.json
    - assets/story/world6.json
    - assets/story/world7.json
    - assets/worlds/saga.json
    - assets/fonts/Jua-OFL.txt
    - assets/fonts/NanumGothic-OFL.txt
    - assets/fonts/GowunDodum-OFL.txt
    - assets/fonts/GamjaFlower-OFL.txt
  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
    - family: NanumGothic
      fonts:
        - asset: assets/fonts/NanumGothic-Regular.ttf
    - family: GowunDodum
      fonts:
        - asset: assets/fonts/GowunDodum-Regular.ttf
    # 감자꽃(OFL): 상용 한글 2350자 + 게임 문구만 남긴 서브셋. 없는 글자는 고운돋움.
    - family: GamjaFlower
      fonts:
        - asset: assets/fonts/GamjaFlower-Subset.ttf

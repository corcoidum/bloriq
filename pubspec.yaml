name: bloriq
description: BLORIQ one-turn echo puzzle prototype.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: 1.38.2
  intl: ^0.20.3
  shared_preferences: ^2.5.3
  share_plus: ^12.0.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/levels/levels.json
    - assets/levels/daily_pool_v1.json
    - assets/audio/
    - assets/art/star_courier/
    - assets/art/last_echo/
    - assets/story/season1.json
    - assets/fonts/Jua-OFL.txt
    - assets/fonts/NanumGothic-OFL.txt
  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
    - family: NanumGothic
      fonts:
        - asset: assets/fonts/NanumGothic-Regular.ttf

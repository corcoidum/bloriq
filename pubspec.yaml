name: bloriq
description: BLORIQ one-turn echo puzzle prototype.
publish_to: 'none'
version: 0.3.1+4

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: 1.38.2
  intl: ^0.20.3
  shared_preferences: ^2.5.3
  share_plus: ^12.0.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/levels/levels.json
    - assets/audio/
    - assets/video/
    - assets/story/season1.json
    - assets/art/moonlit/backgrounds/
    - assets/art/moonlit/tiles/
    - assets/art/moonlit/spirits/
    - assets/art/moonlit/fonts/OFL.txt
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/art/moonlit/fonts/CormorantGaramond.ttf

<script>let mode='dark',locale='ko';document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.mode)mode=b.dataset.mode;if(b.dataset.locale)locale=b.dataset.locale;document.querySelectorAll('button[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.mode===mode)));document.querySelectorAll('button[data-locale]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.locale===locale)));document.querySelectorAll('img[data-state]').forEach(x=>{x.src=`screenshots/star-courier/${mode}-${locale}-${x.dataset.state}.png`})}));</script></html>
